<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
  @for (article of data(); track article.id) {
    <article class="card bg-base-100 shadow-sm border border-base-200 overflow-hidden">
      <figure class="h-48">
        <img
          [src]="article.cover_image || '/images/article-placeholder.jpg'"
          [alt]="article.title"
          class="w-full h-full object-cover"
        />
      </figure>

      <div class="card-body gap-3">
        <h3 class="card-title text-lg">{{ article.title }}</h3>
        <p class="text-sm text-base-content/70">{{ article.excerpt }}</p>

        <div class="card-actions mt-auto">
          <a [routerLink]="['/articles', article.slug]"
             class="link link-primary">
            Read more →
          </a>
        </div>
      </div>
    </article>
  }
</div>
