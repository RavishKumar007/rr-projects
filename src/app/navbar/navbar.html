
<nav class="bg-white border-b border-gray-200 dark:bg-gray-900 dark:border-gray-700">

  <div class="max-w-screen-xl mx-auto px-4">

    <!-- Main Navbar -->
    <div class="flex items-center justify-between py-3">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center shrink-0">
        <img
          src="/assets/rr-proj-logo.png"
          class="h-8 sm:h-9 mr-3"
          alt="RR Projects Logo"
        />

        <span class="text-xl font-bold whitespace-nowrap dark:text-white">
          RR PROJECTS
        </span>
      </a>

      <!-- Desktop Links -->
      <div class="hidden lg:flex items-center gap-8">

        <a routerLink="/articles" class="text-gray-700 hover:text-primary">
          All Articles
        </a>

        <a routerLink="/category/culture" class="text-gray-700 hover:text-primary">
          Culture
        </a>

        <a routerLink="/category/lifestyle" class="text-gray-700 hover:text-primary">
          Lifestyle
        </a>

        <a routerLink="/category/people" class="text-gray-700 hover:text-primary">
          People
        </a>

        <a routerLink="/category/technology" class="text-gray-700 hover:text-primary">
          Technology
        </a>

      </div>

      <!-- Desktop Actions -->
      <div class="hidden lg:flex items-center gap-4">

        <a routerLink="/about" class="text-gray-700 hover:text-primary">
          About
        </a>

        <button class="btn btn-success text-white">
          Subscribe
        </button>

      </div>

      <!-- Mobile Hamburger -->
      <button
        class="btn btn-ghost btn-square lg:hidden"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        aria-label="Toggle navigation menu"
      >
        @if (menuOpen) {
          <span class="text-2xl">✕</span>
        } @else {
          <span class="text-2xl">☰</span>
        }
      </button>

    </div>

    <!-- Mobile Menu -->
    @if (menuOpen) {
      <div class="lg:hidden border-t border-gray-200 dark:border-gray-700 py-3">

        <div class="flex flex-col">

          <a routerLink="/articles"
             (click)="closeMenu()"
             class="px-3 py-3 rounded-lg hover:bg-base-200">
            All Articles
          </a>

          <a routerLink="/category/culture"
             (click)="closeMenu()"
             class="px-3 py-3 rounded-lg hover:bg-base-200">
            Culture
          </a>

          <a routerLink="/category/lifestyle"
             (click)="closeMenu()"
             class="px-3 py-3 rounded-lg hover:bg-base-200">
            Lifestyle
          </a>

          <a routerLink="/category/people"
             (click)="closeMenu()"
             class="px-3 py-3 rounded-lg hover:bg-base-200">
            People
          </a>

          <a routerLink="/category/technology"
             (click)="closeMenu()"
             class="px-3 py-3 rounded-lg hover:bg-base-200">
            Technology
          </a>

          <a routerLink="/about"
             (click)="closeMenu()"
             class="px-3 py-3 rounded-lg hover:bg-base-200">
            About
          </a>

          <button
            class="btn btn-success text-white mt-3"
            (click)="closeMenu()"
          >
            Subscribe
          </button>

        </div>

      </div>
    }

  </div>

</nav>
